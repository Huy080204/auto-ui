<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>auto-ui editor</title>
  </head>
  <body>
    <header class="topbar">
      <strong>auto-ui editor</strong>
      <span id="page-name" class="muted"></span>
      <span class="spacer"></span>
      <span id="status" class="muted">—</span>
      <a id="view-link" class="btn ghost" target="_blank" rel="noreferrer">Xem trang</a>
      <button id="save" class="btn ghost" title="Lưu ngay (Ctrl+S)">Lưu</button>
      <button id="publish" class="btn">Publish</button>
    </header>
    <!--
      Không dựng sidebar riêng nữa: UI mặc định của GrapesJS (panel device/preview/code,
      tab Style–Settings–Layers–Blocks) đúng là UI của grapesjs.com/demo.html, nên để
      GrapesJS tự render toàn bộ vào #gjs.
    -->
    <div id="gjs"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
